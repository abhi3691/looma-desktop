name: Intel Mac installer
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        default: v1.0.0
permissions:
  contents: write
jobs:
  intel-mac:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm --prefix workspace/client ci
      - name: Build native server and voice
        run: |
          python -m venv workspace/server/.venv
          workspace/server/.venv/bin/python -m pip install -r workspace/server/requirements-build.txt
          npm run build:server
          npm run build:voice
      - name: Bundle recognition models and Intel runtime
        run: |
          mkdir -p bundled-models
          curl -fL --retry 3 https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small.bin -o bundled-models/ggml-small.bin
          curl -fL --retry 3 https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en.bin -o bundled-models/ggml-tiny.en.bin
          node scripts/verify-speech-models.mjs
          git clone https://github.com/ggml-org/whisper.cpp.git "$RUNNER_TEMP/whisper"
          git -C "$RUNNER_TEMP/whisper" checkout 6e4ab854f67f743900934a703d5603419384c961
          python scripts/bundle-speech-runtime.py "$RUNNER_TEMP/whisper"
          bundled-speech-runtime/whisper-cli --help
      - run: npm run build:local-runtime
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:workspace
      - name: Create Intel DMG
        run: npx electron-builder --mac dmg --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Looma-Intel-Mac
          path: release/*.dmg
      - name: Add Intel installer to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          cd release
          shasum -a 256 *.dmg > SHA256SUMS-Intel-Mac.txt
          gh release upload "$RELEASE_TAG" ./*.dmg SHA256SUMS-Intel-Mac.txt --clobber
